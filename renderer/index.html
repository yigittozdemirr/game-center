<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https://*.steamstatic.com; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>GameCenter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ambient"></div>

  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M7 6h10a5 5 0 0 1 4.9 6l-1 5a3 3 0 0 1-5.2 1.4L14.2 17H9.8l-1.5 1.4A3 3 0 0 1 3.1 17l-1-5A5 5 0 0 1 7 6Zm1 3v2H6v2h2v2h2v-2h2v-2h-2V9H8Zm8.5 1a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Zm2 2.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z"/></svg>
      <span>GAMECENTER</span>
    </div>
    <nav>
      <button data-nav="all" class="active">
        <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span data-i18n="nav.all">Kütüphane</span>
      </button>
      <button data-nav="fav">
        <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span data-i18n="nav.fav">Favoriler</span>
      </button>
      <button data-nav="recent">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-9 9h2a7 7 0 1 0 2-4.9V10H2V5h2v1.4A9 9 0 0 1 12 3Zm-1 4h2v4.6l3.4 2-1 1.7L11 12.7z"/></svg><span data-i18n="nav.recent">Son Oynanan</span>
      </button>
      <button data-nav="hidden">
        <svg viewBox="0 0 24 24"><path d="M3.3 2 22 20.7 20.7 22l-3.4-3.4A11 11 0 0 1 1 12a11.5 11.5 0 0 1 4.3-5.4L2 3.3zM12 5c5 0 9 3.6 11 7a12 12 0 0 1-3.2 4l-3.1-3.1A5 5 0 0 0 11.1 7L9 5.2A11 11 0 0 1 12 5Z"/></svg><span data-i18n="nav.hidden">Gizlenenler</span>
      </button>
      <div class="nav-sep"></div>
      <button data-nav="platforms">
        <svg viewBox="0 0 24 24"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v8h16V7H4Z"/></svg><span data-i18n="nav.platforms">Platformlar</span>
      </button>
      <button data-nav="emu">
        <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v8h14V5H5Zm3 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm7 .5v2h3v-2h-3Z"/></svg><span data-i18n="nav.emu">Emülatörler</span>
      </button>
      <button data-nav="shots">
        <svg viewBox="0 0 24 24"><path d="M9 3h6l1.8 2H20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3.2L9 3Zm3 5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg><span data-i18n="nav.shots">Ekran Görüntüleri</span>
      </button>
      <button data-nav="stats">
        <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z"/></svg><span data-i18n="nav.stats">İstatistikler</span>
      </button>
    </nav>
    <div class="nav-bottom">
      <button data-nav="settings">
        <svg viewBox="0 0 24 24"><path d="m13.8 2 .5 2.6 1.6.7 2.2-1.5 2.6 2.6-1.5 2.2.7 1.6 2.6.5v3.6l-2.6.5-.7 1.6 1.5 2.2-2.6 2.6-2.2-1.5-1.6.7-.5 2.6h-3.6l-.5-2.6-1.6-.7-2.2 1.5-2.6-2.6 1.5-2.2-.7-1.6L2 13.8v-3.6l2.6-.5.7-1.6-1.5-2.2 2.6-2.6 2.2 1.5 1.6-.7.5-2.6zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg><span data-i18n="nav.settings">Ayarlar</span>
      </button>
      <div class="stat-card"><b id="count">0</b><span data-i18n="stat">oyun kütüphanende</span></div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <label class="search">
        <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 6 12l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
        <input id="search" data-i18n-ph="search" autocomplete="off">
      </label>
      <button id="rescan" class="icon-btn" data-i18n-title="rescan">
        <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.5A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8Zm8 8a8 8 0 0 1-15.4 3H7v-2H1v6h2v-2.5A10 10 0 0 0 22 12h-2Z"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Dil / Language">
        <button data-lang="tr">TR</button><button data-lang="en">EN</button>
      </div>
    </header>
    <section id="view"></section>
  </main>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
